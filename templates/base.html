<!doctype html>
<html lang="en" class="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="view-transition" content="same-origin" />
<title>{% block title %}Class Notes{% endblock %}</title>

<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:wght@400;600;700&family=Inter:wght@400;500&family=JetBrains+Mono:wght@500&display=swap" rel="stylesheet"/>

<script id="tailwind-config">
tailwind.config = {
    darkMode: "class",
    theme: {
        extend: {
            "colors": {
                "on-background": "#dae2fd",
                "background": "#0b1326",
                "tertiary": "#adc6ff",
                "on-error": "#690005",
                "on-tertiary-fixed-variant": "#004395",
                "on-surface": "#dae2fd",
                "on-surface-variant": "#cbc3d7",
                "surface-tint": "#d0bcff",
                "surface-container-high": "#222a3d",
                "on-primary-fixed-variant": "#5516be",
                "surface-bright": "#31394d",
                "surface": "#0b1326",
                "on-secondary-fixed-variant": "#004e5c",
                "tertiary-fixed-dim": "#adc6ff",
                "outline": "#958ea0",
                "on-secondary-container": "#00424e",
                "surface-container-highest": "#2d3449",
                "secondary-fixed-dim": "#4cd7f6",
                "secondary-fixed": "#acedff",
                "primary-container": "#a078ff",
                "on-primary-fixed": "#23005c",
                "on-primary-container": "#340080",
                "on-tertiary-container": "#00285d",
                "secondary": "#4cd7f6",
                "error-container": "#93000a",
                "surface-container-low": "#131b2e",
                "primary-fixed": "#e9ddff",
                "surface-container": "#171f33",
                "on-error-container": "#ffdad6",
                "inverse-on-surface": "#283044",
                "primary-fixed-dim": "#d0bcff",
                "primary": "#d0bcff",
                "secondary-container": "#03b5d3",
                "tertiary-fixed": "#d8e2ff",
                "inverse-primary": "#6d3bd7",
                "inverse-surface": "#dae2fd",
                "surface-dim": "#0b1326",
                "on-tertiary-fixed": "#001a42",
                "tertiary-container": "#4d8eff",
                "on-secondary-fixed": "#001f26",
                "outline-variant": "#494454",
                "surface-container-lowest": "#060e20",
                "on-primary": "#3c0091",
                "on-secondary": "#003640",
                "surface-variant": "#2d3449",
                "error": "#ffb4ab",
                "on-tertiary": "#002e6a"
            },
            "fontFamily": {
                "display-lg-mobile": ["Hanken Grotesk"],
                "headline-md": ["Hanken Grotesk"],
                "label-sm": ["JetBrains Mono"],
                "body-md": ["Inter"],
                "display-lg": ["Hanken Grotesk"],
                "body-lg": ["Inter"]
            },
            "animation": {
                "pulse-glow": "pulseGlow 2s infinite",
                "fade-in-up": "fadeInUp 0.8s ease-out forwards",
                "pulse-amber": "pulseAmber 2s infinite",
                "fade-in": "fadeIn 0.5s ease-out"
            },
            "keyframes": {
                pulseGlow: {
                    "0%, 100%": { boxShadow: "0 0 10px rgba(160, 120, 255, 0.4), 0 0 20px rgba(160, 120, 255, 0.2)" },
                    "50%": { boxShadow: "0 0 25px rgba(160, 120, 255, 0.8), 0 0 40px rgba(160, 120, 255, 0.5)" }
                },
                fadeInUp: {
                    "0%": { opacity: "0", transform: "translateY(20px)" },
                    "100%": { opacity: "1", transform: "translateY(0)" }
                },
                pulseAmber: {
                    "0%, 100%": { opacity: "1" },
                    "50%": { opacity: "0.5" }
                },
                fadeIn: {
                    "0%": { opacity: "0" },
                    "100%": { opacity: "1" }
                }
            }
        }
    }
}
</script>
<style>
    body {
        background-color: #0F172A;
        background-image: radial-gradient(circle at 50% 0%, #1a2235 0%, #0b1326 100%);
        color: #dae2fd;
        min-height: max(884px, 100dvh);
    }
    
    /* View Transitions API */
    @view-transition {
      navigation: auto;
    }
    ::view-transition-old(root) {
      animation: 0.4s ease-in-out both fade-out;
    }
    ::view-transition-new(root) {
      animation: 0.4s ease-in-out both fade-in;
    }
    @keyframes fade-out { to { opacity: 0; transform: translateY(-10px); } }
    @keyframes fade-in { from { opacity: 0; transform: translateY(10px); } }

    /* Glass Input Styles */
    .glass-input {
        background: rgba(255, 255, 255, 0.03);
        border: 1px solid rgba(255, 255, 255, 0.1);
        border-bottom: 1px solid rgba(255, 255, 255, 0.2);
        transition: all 0.3s ease;
    }
    .glass-input:focus {
        background: rgba(255, 255, 255, 0.08);
        border-bottom: 1px solid #d0bcff;
        outline: none;
        box-shadow: 0 4px 20px rgba(208, 188, 255, 0.1);
    }
    
    .inner-glow-panel {
        box-shadow: inset 0 0 0 1px rgba(255, 255, 255, 0.05);
    }

    .delay-100 { animation-delay: 100ms; }
    .delay-200 { animation-delay: 200ms; }
    .delay-300 { animation-delay: 300ms; }
</style>
</head>
<body class="min-h-screen font-[Inter] overflow-x-hidden pb-24 md:pb-0">
  <header class="fixed top-0 w-full z-50 bg-white/3 dark:bg-white/3 backdrop-blur-md border-b border-white/10 inner-glow shadow-sm transition-all duration-300">
      <div class="flex items-center justify-between px-6 h-16 w-full max-w-7xl mx-auto">
          <a href="/" class="text-on-surface-variant font-medium hover:bg-white/10 transition-colors scale-95 duration-200 p-2 rounded-full flex items-center justify-center">
              <span class="material-symbols-outlined" data-icon="home">home</span>
          </a>
          <h1 class="font-[Hanken_Grotesk] text-[24px] md:text-[28px] tracking-tight text-on-surface flex-1 text-center font-bold" style="view-transition-name: app-title;">
              Nexus Notes
          </h1>
          <div class="w-10"></div>
      </div>
  </header>

  <main class="pt-24 px-4 md:px-6 max-w-7xl mx-auto pb-12">
      {% block body %}{% endblock %}
  </main>
</body>
</html>
