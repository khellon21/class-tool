<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% block title %}Class Notes{% endblock %}</title>
<style>
  :root {
    --bg: #fbfaf8; --fg: #1c1b19; --muted: #6b6862; --line: #e3e0da;
    --card: #fff; --accent: #b8543a; --accent-fg: #fff;
  }
  @media (prefers-color-scheme: dark) {
    :root { --bg:#16150f; --fg:#eceae4; --muted:#9a968c; --line:#302e26;
            --card:#1e1d16; --accent:#d9765a; --accent-fg:#16150f; }
  }
  * { box-sizing: border-box; }
  body { margin:0; background:var(--bg); color:var(--fg); font:16px/1.6 ui-sans-serif, -apple-system, system-ui, sans-serif; }
  main { max-width: 820px; margin: 0 auto; padding: 2.5rem 1.25rem 5rem; }
  h1 { font-size:1.6rem; margin:0 0 .25rem; letter-spacing:-.02em; }
  h2 { font-size:1.1rem; margin:2.5rem 0 .75rem; letter-spacing:-.01em; }
  a { color:inherit; }
  .sub { color:var(--muted); margin:0 0 2rem; }
  .card { background:var(--card); border:1px solid var(--line); border-radius:12px; padding:1.25rem; }
  button, .btn { font:inherit; padding:.55rem 1rem; border-radius:8px; border:1px solid var(--line);
                 background:var(--card); color:var(--fg); cursor:pointer; }
  button:hover:not(:disabled), .btn:hover { border-color:var(--muted); }
  button:disabled { opacity:.45; cursor:not-allowed; }
  button.primary { background:var(--accent); color:var(--accent-fg); border-color:var(--accent); }
  input, select, textarea { font:inherit; color:var(--fg); background:var(--bg);
                            border:1px solid var(--line); border-radius:8px; padding:.55rem .7rem; }
  input, select { width:100%; }
  label { display:block; font-size:.85rem; color:var(--muted); margin-bottom:.3rem; }
  .row { display:flex; gap:.75rem; flex-wrap:wrap; align-items:center; }
  .grid { display:grid; gap:.9rem; grid-template-columns:repeat(auto-fit,minmax(200px,1fr)); }
  .list { list-style:none; padding:0; margin:0; }
  .list li a { display:flex; justify-content:space-between; gap:1rem; align-items:center;
               padding:.85rem 1rem; border:1px solid var(--line); border-radius:10px;
               background:var(--card); margin-bottom:.5rem; text-decoration:none; }
  .list li a:hover { border-color:var(--muted); }
  .tag { font-size:.75rem; color:var(--muted); border:1px solid var(--line); border-radius:99px; padding:.1rem .55rem; }
  .status { color:var(--muted); font-size:.9rem; min-height:1.4em; }
  .status.err { color:var(--accent); }
  .rec-dot { display:inline-block; width:9px; height:9px; border-radius:50%; background:var(--accent);
             margin-right:.4rem; animation:pulse 1.2s infinite; }
  @keyframes pulse { 50% { opacity:.25; } }
  .note { font-size:.85rem; color:var(--muted); border-left:2px solid var(--line); padding-left:.8rem; margin:.9rem 0 0; }
  textarea { width:100%; min-height:420px; font-family:ui-monospace, SFMono-Regular, Menlo, monospace; font-size:.87rem; line-height:1.65; }
  pre { white-space:pre-wrap; word-wrap:break-word; background:var(--card); border:1px solid var(--line);
        border-radius:10px; padding:1rem; font-size:.85rem; max-height:400px; overflow:auto; }
  details summary { cursor:pointer; color:var(--muted); }
</style>
</head>
<body>
<main>{% block body %}{% endblock %}</main>
</body>
</html>
